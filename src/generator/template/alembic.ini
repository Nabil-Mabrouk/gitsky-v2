# Configuration Alembic multi-chaînes (Chap 4).
# La section [alembic] par défaut = chaîne du core. Chaque module ajoutera sa
# propre section (--name <module>) avec son script_location et sa version_table.
# L'URL de connexion n'est PAS ici : env.py la lit depuis les settings
# (DATABASE_URL), sauf override explicite via sqlalchemy.url (utilisé en test).

[alembic]
script_location = alembic/core
version_table = alembic_version_core

# Chaîne du module analytics (appliquée si MODULE_ANALYTICS=true).
# CLI équivalente : alembic -c alembic.ini --name analytics upgrade head
[analytics]
script_location = alembic/modules/analytics
version_table = alembic_version_analytics

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
