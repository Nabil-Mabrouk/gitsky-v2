# Services agentic déclaratifs (Chap 15). Un service = des `steps` (chacun
# `type: agent` [appel LLM] ou `type: tool` [callable enregistré]) et des
# `workflows` (listes ordonnées de noms de steps). Un workflow listé dans
# `async_workflows` s'exécute en job de fond (submit-and-return) ; les autres
# sont synchrones. Ajouter un service ne demande aucun code Python.
services:
  template_service:
    enabled: true
    name: "Service Exemple"
    description: "Service de démonstration du moteur agentic"
    category: "demo"
    cost_credits: 0
    steps:
      greet:
        type: agent
        model: "claude-sonnet-4-6"
        system_prompt: "Tu es un assistant de démonstration."
        temperature: 0.3
    workflows:
      example_workflow: [greet]
    async_workflows: []
