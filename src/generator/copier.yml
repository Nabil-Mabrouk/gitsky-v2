# Générateur create-gitsky-project (Chap 17) — spike Phase 2.
# API Copier réelle : context hook (résolution du tier) + _tasks + _migrations.
# Le livre décrit des hooks style Cookiecutter (_pre/_post_generation) ; ici on
# utilise le vrai mécanisme Copier.

_subdirectory: template
_templates_suffix: .jinja

# Le TemplateExtensionLoader permet de référencer une extension par chemin
# relatif au template (extensions/context.py) plutôt qu'un module installé.
_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions/context.py:TierResolver

project_name:
  type: str
  help: Nom du projet (préfixe de toutes les ressources Docker/DB)
  default: mon-projet

gitsky_tier:
  type: str
  help: Tier initial du projet (chaque projet naît en t0)
  choices:
    - t0
    - t1
    - t2
  default: t0

# Overrides des flags module par-dessus le profil de tier (clés courtes, sans
# le préfixe module_). Ex. dans config.yaml : modules: { agentic: true }
modules:
  type: yaml
  help: "Overrides des flags module par tier (ex. {agentic: true})"
  default: {}

# Modèles métier à scaffolder dans app/domain/ (cf. config.yaml du Chap 17).
# Liste de { name, fields: { champ: type } }, type ∈ str|text|int|bool|float|datetime.
data_models:
  type: yaml
  help: "Modèles métier (liste name + fields)"
  default: []

# Domaine du projet. Défaut = sous-domaine wildcard *.mystudio.com (T0/T1) ;
# un T2 promu recevra un domaine premier dédié (Chap 2).
project_domain:
  type: str
  help: "Domaine du projet"
  default: "{{ project_name }}.mystudio.com"

# Charte graphique injectée dans le frontend (variables CSS).
branding:
  type: yaml
  help: "Branding (primary_color, primary_foreground, font_family)"
  default:
    primary_color: "#4F46E5"
    primary_foreground: "#FFFFFF"
    font_family: "Inter"

# _tasks : exécutés après la génération des fichiers (le « post » réel de Copier).
# Conditionnés à la GÉNÉRATION INITIALE (_copier_operation == 'copy') — pas au
# copier update, où c'est _migrations qui prend le relais.
# provision_db / register_fleet sont SIMULÉS (à connecter aux services réels).
# Scripts hors du sous-répertoire template/ -> non livrés dans le projet généré.
_tasks:
  - command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/provision_db.py {{ project_name }}"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/register_fleet.py {{ project_name }} {{ gitsky_tier }}"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git init -q"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add -A"
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git -c user.email=gen@gitsky -c user.name=create-gitsky-project commit -q -m "Initial commit (create-gitsky-project)"'
    when: "{{ _copier_operation == 'copy' }}"

# _migrations : exécutées lors d'un `copier update`, quand la version franchie
# est >= la version déclarée > l'ancienne version. Le script reçoit VERSION_FROM
# / VERSION_TO en variables d'environnement.
# ⚠️ SIMULÉ : représente la ré-application des migrations Alembic après évolution
# du template. À CONNECTER au vrai scripts/migrate.py du projet.
_migrations:
  - version: "1.0.0"
    command: "{{ _copier_python }} {{ _copier_conf.src_path }}/tasks/apply_migrations.py"
