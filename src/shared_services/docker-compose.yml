# Services partagés de la flotte GitSky (Chap 18).
# Bootstrap unique du VPS : Traefik (seul exposé), et les services internes sur
# shared-services-net (jamais joignables depuis Internet). Config d'infra —
# renseigner les secrets via un .env hors VCS (.secrets/ ignoré par git).
#
# ACME en HTTP-01 (Chap 22), pas DNS-01/Cloudflare (Chap 18) : premier domaine
# du studio géré directement via les NS IONOS, sans délégation à Cloudflare.
# A reconsidérer pour le DNS-01 wildcard quand la flotte grossit.
services:
  traefik:
    # v3.1 a un bug connu de negociation d'API Docker (toujours 1.24 en dur,
    # rejete par Docker Engine 29.x qui exige >= 1.44). Corrige en v3.6.1+
    # avec negociation automatique - ne pas redescendre sous v3.6.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - proxy-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-services-net

  landing-collector:
    build:
      context: ./landing_collector
    environment:
      - LANDING_DB_URL=postgresql+asyncpg://landing:${LANDING_DB_PASSWORD}@postgres/landing
    networks:
      - shared-services-net
    depends_on:
      - postgres

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    # Sans --config, /v1/models renvoie une liste vide et TOUT appel échoue
    # ("Invalid model name") — déployé un temps sans ce fichier, jamais
    # remarqué car jamais réellement appelé avant le premier run Studio.
    command: ["--config", "/app/config.yaml"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      - shared-services-net
    depends_on:
      - postgres

  # Image placeholder — aucun geoip-service réel n'est encore publié (Chap 18).
  # Profile "geoip" : exclu d'un `docker compose up -d` normal tant qu'aucune
  # image n'existe. Démarrer explicitement avec `--profile geoip` une fois
  # l'image buildée et publiée.
  geoip:
    image: mystudio/geoip-service:latest
    profiles:
      - geoip
    volumes:
      - geoip_data:/data/GeoLite2
    networks:
      - shared-services-net

volumes:
  traefik_acme:
  postgres_data:
  geoip_data:

networks:
  proxy-net:
    external: true
    name: proxy-net
  shared-services-net:
    driver: bridge
    internal: true
