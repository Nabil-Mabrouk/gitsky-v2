# Services partagés de la flotte GitSky (Chap 18).
# Bootstrap unique du VPS : Traefik (seul exposé), et les services internes sur
# shared-services-net (jamais joignables DEPUIS Internet). llm-proxy est aussi
# branché sur egress-net pour pouvoir appeler VERS Internet (api.anthropic.com) ;
# postgres reste isolé dans les deux sens. landing-collector est aussi sur
# proxy-net, mais SEULE sa route POST /leads (capture, publique par
# conception) est exposée via Traefik — voir ses labels ci-dessous.
# Config d'infra — renseigner les secrets via un .env hors VCS (.secrets/
# ignoré par git).
#
# ACME en HTTP-01 (Chap 22), pas DNS-01/Cloudflare (Chap 18) : premier domaine
# du studio géré directement via les NS IONOS, sans délégation à Cloudflare.
# A reconsidérer pour le DNS-01 wildcard quand la flotte grossit.
services:
  traefik:
    # v3.1 a un bug connu de negociation d'API Docker (toujours 1.24 en dur,
    # rejete par Docker Engine 29.x qui exige >= 1.44). Corrige en v3.6.1+
    # avec negociation automatique - ne pas redescendre sous v3.6.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - proxy-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-services-net

  landing-collector:
    build:
      context: ./landing_collector
    restart: unless-stopped
    environment:
      - LANDING_DB_URL=postgresql+asyncpg://landing:${LANDING_DB_PASSWORD}@postgres/landing
      # Garde de lecture /leads/{project}/stats et /leads/{project} (Chap 19,
      # onglet Leads du fleet dashboard) — même valeur que le
      # COLLECTOR_STATS_TOKEN de fleet-dashboard/.env.
      - COLLECTOR_STATS_TOKEN=${COLLECTOR_STATS_TOKEN}
      # Double opt-in (Chap 18) — même compte Gmail que Waitlist, mêmes noms
      # de variable que app/core/mailer.py, namespace de fichier différent
      # (shared_services/.env) donc pas de collision.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    labels:
      # Seule POST /leads (capture, publique par conception) et GET
      # /leads/verify/{token} (confirmation double opt-in) sont exposées via
      # Traefik — Path()/PathPrefix() ciblés, donc /leads/{project} et
      # /leads/{project}/stats (protégés par COLLECTOR_STATS_TOKEN) restent
      # injoignables depuis Internet, cohérent avec shared-services-net: internal.
      # Rules sans Host() : matchent sur TOUS les domaines de la flotte (chaque
      # landing T0 poste/renvoie en same-origin vers son propre domaine).
      # priority=100 EXPLICITE sur les deux routeurs (même valeur que
      # authlimit-{{ project_name }} dans docker-compose.yml.jinja) : bug réel
      # constaté en prod — sans priority, Traefik départage par défaut sur la
      # LONGUEUR de la chaîne de règle, et Host(`politique-ia.0-hitl.com`) (le
      # routeur frontend du projet, aucun Host() ici) s'est révélé plus long
      # que PathPrefix(`/leads/verify`) et gagnait le match, renvoyant le lien
      # de confirmation vers la vitrine au lieu du landing collector.
      - "traefik.enable=true"
      - "traefik.http.routers.landing-collector-leads.rule=Path(`/leads`) && Method(`POST`)"
      - "traefik.http.routers.landing-collector-leads.entrypoints=websecure"
      - "traefik.http.routers.landing-collector-leads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-collector-leads.priority=100"
      - "traefik.http.services.landing-collector-leads.loadbalancer.server.port=8000"
      # Un flood de POST /leads déclenche maintenant un vrai envoi d'email
      # (double opt-in) — sans limite, le formulaire public devient un
      # vecteur de spam vers n'importe quelle adresse tierce, pas seulement
      # du bruit en base. Même mécanisme que /api/auth/login (docker-compose.yml.jinja).
      - "traefik.http.middlewares.leadslimit.ratelimit.average=3"
      - "traefik.http.middlewares.leadslimit.ratelimit.period=1m"
      - "traefik.http.middlewares.leadslimit.ratelimit.burst=5"
      - "traefik.http.routers.landing-collector-leads.middlewares=leadslimit"
      - "traefik.http.routers.landing-collector-verify.rule=PathPrefix(`/leads/verify`)"
      - "traefik.http.routers.landing-collector-verify.entrypoints=websecure"
      - "traefik.http.routers.landing-collector-verify.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-collector-verify.priority=100"
      - "traefik.http.routers.landing-collector-verify.service=landing-collector-leads"
    networks:
      - shared-services-net
      - proxy-net
    depends_on:
      - postgres

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    # Sans --config, /v1/models renvoie une liste vide et TOUT appel échoue
    # ("Invalid model name") — déployé un temps sans ce fichier, jamais
    # remarqué car jamais réellement appelé avant le premier run Studio.
    command: ["--config", "/app/config.yaml"]
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # Clé Groq (round 0-hl, 2026-11-21) : posée par l'opérateur directement
      # dans ce .env sur le serveur — jamais par un dépôt projet ni un agent.
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Clé DeepSeek (round politique-ia, 2026-11-21), même règle que Groq.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Base LiteLLM (Chap 18 §4) : jetons virtuels par projet, budgets,
      # /key/info, /spend/logs. Absente jusqu'au 2026-11-21 (écart au livre
      # constaté par l'agent de 0-hl) : sans elle, la seule authentification
      # possible était la clé MAÎTRE, distribuée telle quelle aux projets.
      # Rôle/base créés par scripts/llm-proxy-keys.sh init-db.
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      - shared-services-net
      - egress-net
      # Réseau minimal des workers des projets (Chap 1/18, 2026-11-23) : ils
      # n'y voient que ce service.
      - llm-net
    depends_on:
      - postgres

  umami:
    # Mesure d'audience de toute la flotte (Chap 13 §« Mesure d'Audience »,
    # Chap 18 §8). Version ÉPINGLÉE (jamais latest : un redéploiement ne doit
    # pas migrer la base par surprise) — tag vérifié sur ghcr.io le
    # 2026-11-26. Base `umami` sur le postgres partagé, rôle/base/secrets
    # créés par scripts/umami-setup.sh init.
    image: ghcr.io/umami-software/umami:3.5.0
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      # Obligatoire depuis la 3.5.0. Le changer déconnecte tout le monde et
      # réinitialise les identifiants anonymes de visite : généré une fois.
      - APP_SECRET=${UMAMI_APP_SECRET}
      # Noms neutres : les bloqueurs de pub filtrent script.js / /api/send.
      - TRACKER_SCRIPT_NAME=s.js
      - COLLECT_API_ENDPOINT=/api/c
      - DISABLE_TELEMETRY=1
      - DISABLE_UPDATES=1
      # Derrière Traefik : l'IP réelle du visiteur (pays, unicité) vient de
      # X-Forwarded-For, posé par le proxy sur le réseau Docker privé.
      - TRUSTED_PROXIES=private
    labels:
      # Seule entrée publique : stats.<domaine du fleet dashboard>. Le
      # navigateur des visiteurs y charge s.js et y poste ses mesures ;
      # l'opérateur s'y connecte au tableau de bord (mot de passe admin
      # changé dès la première connexion, Chap 18 §8).
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`${UMAMI_HOST}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    networks:
      - shared-services-net
      - proxy-net
    depends_on:
      - postgres

volumes:
  traefik_acme:
  postgres_data:

networks:
  proxy-net:
    external: true
    name: proxy-net
  shared-services-net:
    driver: bridge
    internal: true
  # Réseau bridge normal (pas internal:true) : donne une route NAT vers
  # Internet. shared-services-net reste internal (postgres, landing-collector
  # n'ont aucune raison de sortir) ; seul llm-proxy est aussi branché ici,
  # car c'est le seul service qui a besoin d'appeler l'API Anthropic réelle
  # (api.anthropic.com) — sans ce réseau, "Temporary failure in name
  # resolution" dès le premier appel réel (jamais remarqué avant, le proxy
  # n'avait jamais servi pour de vrai).
  egress-net:
    driver: bridge
  # Réseau dédié à l'accès LLM des workers des projets générés (Chap 1 et 18,
  # demande 0-hl du 2026-11-23). SEUL llm-proxy y est branché : un worker
  # (qui traite des données externes) joint le proxy sans voir postgres,
  # landing-collector — contrairement à shared-services-net.
  # internal: true (aucune sortie par ce réseau ; llm-proxy sort via
  # egress-net). Nom explicite, sans préfixe Compose : les projets le
  # rejoignent en external sous ce nom exact.
  llm-net:
    driver: bridge
    internal: true
    name: gitsky-llm-net
