# Services partagés de la flotte GitSky (Chap 18).
# Bootstrap unique du VPS : Traefik (seul exposé), et les services internes sur
# shared-services-net (jamais joignables DEPUIS Internet). llm-proxy est aussi
# branché sur egress-net pour pouvoir appeler VERS Internet (api.anthropic.com) ;
# postgres reste isolé dans les deux sens. landing-collector est aussi sur
# proxy-net, mais SEULE sa route POST /leads (capture, publique par
# conception) est exposée via Traefik — voir ses labels ci-dessous.
# Config d'infra — renseigner les secrets via un .env hors VCS (.secrets/
# ignoré par git).
#
# ACME en HTTP-01 (Chap 22), pas DNS-01/Cloudflare (Chap 18) : premier domaine
# du studio géré directement via les NS IONOS, sans délégation à Cloudflare.
# A reconsidérer pour le DNS-01 wildcard quand la flotte grossit.
services:
  traefik:
    # v3.1 a un bug connu de negociation d'API Docker (toujours 1.24 en dur,
    # rejete par Docker Engine 29.x qui exige >= 1.44). Corrige en v3.6.1+
    # avec negociation automatique - ne pas redescendre sous v3.6.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - proxy-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-services-net

  landing-collector:
    build:
      context: ./landing_collector
    environment:
      - LANDING_DB_URL=postgresql+asyncpg://landing:${LANDING_DB_PASSWORD}@postgres/landing
      # Garde de lecture /leads/{project}/stats et /leads/{project} (Chap 19,
      # onglet Leads du fleet dashboard) — même valeur que le
      # COLLECTOR_STATS_TOKEN de fleet-dashboard/.env.
      - COLLECTOR_STATS_TOKEN=${COLLECTOR_STATS_TOKEN}
      # Double opt-in (Chap 18) — même compte Gmail que Waitlist, mêmes noms
      # de variable que app/core/mailer.py, namespace de fichier différent
      # (shared_services/.env) donc pas de collision.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    labels:
      # Seule POST /leads (capture, publique par conception) et GET
      # /leads/verify/{token} (confirmation double opt-in) sont exposées via
      # Traefik — Path()/PathPrefix() ciblés, donc /leads/{project} et
      # /leads/{project}/stats (protégés par COLLECTOR_STATS_TOKEN) restent
      # injoignables depuis Internet, cohérent avec shared-services-net: internal.
      # Rules sans Host() : matchent sur TOUS les domaines de la flotte (chaque
      # landing T0 poste/renvoie en same-origin vers son propre domaine).
      - "traefik.enable=true"
      - "traefik.http.routers.landing-collector-leads.rule=Path(`/leads`) && Method(`POST`)"
      - "traefik.http.routers.landing-collector-leads.entrypoints=websecure"
      - "traefik.http.routers.landing-collector-leads.tls.certresolver=letsencrypt"
      - "traefik.http.services.landing-collector-leads.loadbalancer.server.port=8000"
      # Un flood de POST /leads déclenche maintenant un vrai envoi d'email
      # (double opt-in) — sans limite, le formulaire public devient un
      # vecteur de spam vers n'importe quelle adresse tierce, pas seulement
      # du bruit en base. Même mécanisme que /api/auth/login (docker-compose.yml.jinja).
      - "traefik.http.middlewares.leadslimit.ratelimit.average=3"
      - "traefik.http.middlewares.leadslimit.ratelimit.period=1m"
      - "traefik.http.middlewares.leadslimit.ratelimit.burst=5"
      - "traefik.http.routers.landing-collector-leads.middlewares=leadslimit"
      - "traefik.http.routers.landing-collector-verify.rule=PathPrefix(`/leads/verify`)"
      - "traefik.http.routers.landing-collector-verify.entrypoints=websecure"
      - "traefik.http.routers.landing-collector-verify.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-collector-verify.service=landing-collector-leads"
    networks:
      - shared-services-net
      - proxy-net
    depends_on:
      - postgres

  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    # Sans --config, /v1/models renvoie une liste vide et TOUT appel échoue
    # ("Invalid model name") — déployé un temps sans ce fichier, jamais
    # remarqué car jamais réellement appelé avant le premier run Studio.
    command: ["--config", "/app/config.yaml"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      - shared-services-net
      - egress-net
    depends_on:
      - postgres

  # Image placeholder — aucun geoip-service réel n'est encore publié (Chap 18).
  # Profile "geoip" : exclu d'un `docker compose up -d` normal tant qu'aucune
  # image n'existe. Démarrer explicitement avec `--profile geoip` une fois
  # l'image buildée et publiée.
  geoip:
    image: mystudio/geoip-service:latest
    profiles:
      - geoip
    volumes:
      - geoip_data:/data/GeoLite2
    networks:
      - shared-services-net

volumes:
  traefik_acme:
  postgres_data:
  geoip_data:

networks:
  proxy-net:
    external: true
    name: proxy-net
  shared-services-net:
    driver: bridge
    internal: true
  # Réseau bridge normal (pas internal:true) : donne une route NAT vers
  # Internet. shared-services-net reste internal (postgres, landing-collector
  # n'ont aucune raison de sortir) ; seul llm-proxy est aussi branché ici,
  # car c'est le seul service qui a besoin d'appeler l'API Anthropic réelle
  # (api.anthropic.com) — sans ce réseau, "Temporary failure in name
  # resolution" dès le premier appel réel (jamais remarqué avant, le proxy
  # n'avait jamais servi pour de vrai).
  egress-net:
    driver: bridge
