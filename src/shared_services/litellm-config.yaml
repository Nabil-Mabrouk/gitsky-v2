# Config du llm-proxy partagé (Chap 18) — mappe les noms de modèle utilisés
# par le code appelant (Studio, agentic des projets générés) vers de vrais
# modèles Anthropic. Déployé sans ce fichier au départ : `/v1/models`
# renvoyait une liste vide, tout appel échouait ("Invalid model name").
model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Image hero réelle (Round B, Chap 24) — même proxy, même mécanisme que les
  # chat completions ci-dessus, litellm route aussi /v1/images/generations.
  - model_name: dalle-3
    litellm_params:
      model: openai/dall-e-3
      api_key: os.environ/OPENAI_API_KEY
