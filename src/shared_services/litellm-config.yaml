# Config du llm-proxy partagé (Chap 18) — mappe les noms de modèle utilisés
# par le code appelant (Studio, agentic des projets générés) vers de vrais
# modèles Anthropic. Déployé sans ce fichier au départ : `/v1/models`
# renvoyait une liste vide, tout appel échouait ("Invalid model name").
model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Round modeles IA politique-ia (Chap 20 de sa propre spec) : plusieurs
  # roles rapides/peu couteux (turn_analyst, move_planner, moderation...)
  # recommandent Claude Haiku 5.5, absent du proxy jusqu'ici - aucun projet
  # n'en avait eu besoin avant.
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Image hero réelle (Round B, Chap 24) — même proxy, même mécanisme que les
  # chat completions ci-dessus, litellm route aussi /v1/images/generations.
  # DALL-E 3 retiré de l'API OpenAI le 12 mai 2026 (trouvé en prod, premier
  # vrai appel : "The model 'dall-e-3' does not exist") — gpt-image-2 est le
  # remplaçant recommandé par OpenAI (lancé le 21 avril 2026).
  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/OPENAI_API_KEY
  # Groq (round 0-hl, 2026-11-21) — modèles open-weight rapides, compatibles
  # tools/tool_choice. Alias préfixés groq- : le nom côté projet reste stable
  # même si Groq renomme/retire un modèle (seule cette ligne change). Liste à
  # revalider par un vrai appel avec outil après chaque changement : le
  # catalogue Groq évolue vite.
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

# Chap 18 §4 — absent jusqu'au 2026-11-21 (écart constaté par l'agent de
# 0-hl) : sans database_url, LiteLLM n'a ni jetons virtuels, ni budgets, ni
# spend logs, et la clé maître était le seul jeton possible pour un projet.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Spend logs = attribution des coûts par projet (modèle, tokens, coût),
  # jamais le contenu des prompts/réponses des projets.
  store_prompts_in_spend_logs: false
