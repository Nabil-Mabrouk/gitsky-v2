# CI GitSky — exécute les suites backend (pytest) et frontend (Vitest).
#
# Les tests d'intégration Docker (test_docker_build_integration.py) buildent de
# vraies images : trop lourds pour chaque push, ils restent déclenchables à la
# main (workflow_dispatch) via le job docker-integration.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: pytest (générateur + châssis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/generator/requirements.txt
            src/generator/template/requirements.txt
            src/shared_services/geoip_service/requirements.txt
      - name: Installer les dépendances
        run: |
          pip install -r src/generator/requirements.txt \
                      -r src/generator/template/requirements.txt \
                      -r src/shared_services/geoip_service/requirements.txt
      - name: Lancer la suite
        run: python -m pytest src/tests -q --deselect src/tests/test_docker_build_integration.py

  frontend:
    name: vitest (frontend du template)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/generator/template/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/generator/template/frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer la suite
        run: npm test

  docker-integration:
    name: pytest (intégration Docker, manuel)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          pip install -r src/generator/requirements.txt \
                      -r src/generator/template/requirements.txt
      - name: Lancer les tests Docker
        run: python -m pytest src/tests/test_docker_build_integration.py -q
